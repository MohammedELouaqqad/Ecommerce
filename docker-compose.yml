# Seul l'api-gateway publie un port : les services ne sont joignables
# que par le reseau interne de Docker. Pour ouvrir les ports en debug :
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
services:
  # ==========================================
  # 1. DATABASE (One container, 3 databases)
  # ==========================================
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. USER SERVICE (Port 8081)
  # ==========================================
  user-service:
    build: ./user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/db_users?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Premier Admin : lu depuis le fichier .env (non versionne), jamais ecrit ici
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Obligatoire : docker compose refuse de demarrer si JWT_SECRET manque dans .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini dans .env}
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # 3. PRODUCT SERVICE (Port 8082)
  # ==========================================
  product-service:
    build: ./product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/db_products?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # 4. ORDER SERVICE (Port 8083)
  # ==========================================
  order-service:
    build: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/db_orders?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # 5. AI SERVICE (Port 8084) - No Database
  # ==========================================
  ai-service:
    build: ./ai-service
    environment:
      SERVER_PORT: 8084
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      # Active depuis .env ; false par defaut pour qui n'a pas de cle
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      # Doit valoir "openai" quand OPENAI_ENABLED=true, sinon le ChatClient ne peut pas etre cree
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
    restart: on-failure

  # ==========================================
  # 6. S3 SERVICE (Port 8085) - No Database
  # ==========================================
  s3-service:
    build: ./s3-service
    environment:
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-false}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini dans .env}
      # Origine(s) du frontend, separees par des virgules (ton vrai domaine en production)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - user-service
      - product-service
      - order-service
      - ai-service
      - s3-service
    restart: on-failure

volumes:
  mysql_data: